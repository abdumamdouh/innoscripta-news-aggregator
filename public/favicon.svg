<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="innoscripta News">
  <title>innoscripta News</title>
  <rect width="32" height="32" rx="7" fill="#1c5cff" />
  <!--
    Four bars of different lengths merging into one full-width rule: four newsrooms, one
    feed. Chunky and few, because at 16px in a browser tab anything finer turns to mud.
  -->
  <g fill="#ffffff">
    <rect x="7" y="8" width="11" height="3" rx="1.5" />
    <rect x="7" y="13" width="18" height="3" rx="1.5" opacity="0.75" />
    <rect x="7" y="18" width="8" height="3" rx="1.5" opacity="0.55" />
    <rect x="7" y="23" width="18" height="3" rx="1.5" />
  </g>
</svg>
