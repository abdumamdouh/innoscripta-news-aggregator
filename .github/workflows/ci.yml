name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The same scripts a developer runs locally — CI must not drift into its own commands.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Item 4's promise, enforced on every push: no key, and no VITE_-prefixed anything,
      # can reach the built bundle. Keys are attached server-side by nginx at runtime.
      - name: No provider key in the bundle
        run: |
          ! grep -rn 'VITE_' dist/
          ! grep -rniE '(api-?key|apiKey)=[A-Za-z0-9]' dist/

      # Build only: running the image needs real keys, which a fork's PR does not get.
      - run: docker build -t innoscripta-news-aggregator:ci .
